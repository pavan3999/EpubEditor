<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Epub Editor</title>
    <style>
        #drop_zone {
        border: 5px solid blue;
        width:  200px;
        height: 100px;
        }

        #resourceManager { margin-top: 20px; padding: 12px; border: 1px solid #888; }
        #resourceManager textarea { width: 100%; box-sizing: border-box; font-family: monospace; }
        .resource-row { display: flex; gap: 6px; margin: 5px 0; align-items: center; }
        .resource-row input { flex: 1; min-width: 0; }
        .resource-file-row { flex-wrap: wrap; }
        .resource-path { flex: 2 1 320px; overflow-wrap: anywhere; }
        .font-family-input, [data-font-weight], [data-font-style] { min-width: 120px; }
        .resource-list { margin: 6px 0 12px; }
        .resource-help { font-size: 0.9em; opacity: 0.8; }
    </style>

    <style id="mergeEpubStyles">
        .merge-epub-panel { max-width: 760px; margin: 8px 0; }
        .merge-epub-toolbar, .merge-epub-actions {
            display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:6px 0;
        }
        .merge-file-picker { display:inline-flex; cursor:pointer; }
        .merge-file-picker input { position:absolute; width:1px; height:1px; opacity:0; }
        .merge-file-picker span {
            display:inline-block; padding:6px 10px; border:1px solid currentColor;
            border-radius:4px; cursor:pointer;
        }
        .merge-order-help { margin:8px 0; font-size:.9em; opacity:.8; }
        .merge-epub-order {
            margin:8px 0; padding:0; list-style:none; border:1px solid #888;
            border-radius:5px; min-height:46px;
        }
        .merge-epub-item {
            display:flex; align-items:center; gap:7px; padding:7px;
            border-bottom:1px solid #888; user-select:none; touch-action:none;
        }
        .merge-epub-item:last-child { border-bottom:0; }
        .merge-epub-item.dragging { opacity:.45; }
        .merge-epub-item.drop-target { outline:2px dashed currentColor; outline-offset:-2px; }
        .merge-drag-handle {
            cursor:grab; font-size:1.15em; padding:5px; min-width:28px; text-align:center;
        }
        .merge-epub-number { min-width:2em; text-align:center; font-weight:bold; }
        .merge-epub-name { flex:1 1 auto; min-width:0; overflow-wrap:anywhere; }
        .merge-epub-size { opacity:.65; white-space:nowrap; font-size:.85em; }
        .merge-row-buttons { display:flex; gap:3px; flex-wrap:nowrap; }
        .merge-row-buttons button { min-width:34px; min-height:34px; padding:4px 7px; }
        .merge-empty-message {
            padding:10px; text-align:center; opacity:.65;
            border:1px dashed #888; border-radius:5px;
        }
        .merge-duplicate-warning {
            margin:6px 0; padding:7px; border:1px solid currentColor; border-radius:4px;
        }
        .merge-epub-status { margin-top:8px; min-height:1.3em; }
        .merge-base-label {
            font-size:.75em; padding:2px 5px; border:1px solid currentColor;
            border-radius:3px; white-space:nowrap;
        }
    </style>

</head>
<body>
    <h1>Epub Editor</h1>
    <table id="inputsTable">
        <tr>
            <td>
                <div id="drop_zone">
                    <p>Drag epub file to this Drop Zone ...</p>
                </div>
                <input type="file" id="fileNameInput" />
            </td>
            <td>
                <label for="scriptModeSelect"><strong>Script Mode:</strong></label>
                <select id="scriptModeSelect">
                    <option value="dom">DOM (existing)</option>
                    <option value="raw">Raw XHTML (preserve original markup)</option>
                </select>
                <div id="scriptModeHelp" class="resource-help">DOM mode parses each XHTML file and serializes it again when modified.</div>
                <textarea id="mutatorScriptInput" rows="10" cols="70">// DOM mode example: remove "chapter" from title of each chapter
// dom is the DOM for each chapter
// return true if chapter modified, false if not changed
let title = dom.querySelector("h1");
let changed = (title != null);
if (changed) {
    title.textContent = title.textContent.replace("Chapter", "");
}
return changed;
                </textarea>
            </td>
        </tr>
    </table>
    <table id="controls" hidden="true">
        <tr>
            <td></td>
            <td><button id="runScriptButton">Run script above to modify Epub</button></td>
        </tr>

        <tr>
            <td>Merge EPUBs</td>
            <td>
                <div id="mergeEpubPanel" class="merge-epub-panel">
                    <div class="merge-epub-toolbar">
                        <label class="merge-file-picker">
                            <input id="mergeEpubFiles" type="file"
                                   accept=".epub,application/epub+zip" multiple>
                            <span>Add EPUBs</span>
                        </label>
                        <button id="mergeClearButton" type="button">Clear all</button>
                        <span id="mergeEpubCount">0 EPUBs</span>
                    </div>
                    <div id="mergeDuplicateWarning" class="merge-duplicate-warning" hidden></div>
                    <div class="merge-order-help">
                        Merge order is top → bottom. Drag the ☷ handle, or use ↑ / ↓.
                        The first EPUB is the BASE EPUB.
                    </div>
                    <ol id="mergeEpubOrder" class="merge-epub-order"
                        aria-label="EPUB merge order"></ol>
                    <div id="mergeEmptyMessage" class="merge-empty-message">
                        Select EPUB files to build the merge order.
                    </div>
                    <div class="merge-epub-actions">
                        <button id="mergeEpubButton" type="button" disabled>
                            Merge Selected EPUBs
                        </button>
                    </div>
                    <div id="mergeEpubStatus" class="merge-epub-status"
                         aria-live="polite"></div>
                </div>
            </td>
        </tr>
<tr>
            <td></td>
            <td><button id="runScriptAsyncButton">Run async script</button></td>
        </tr>
        <tr>
            <td></td>
            <td><button id="checkForInvalidXhtmlButton">Check for Invalid XHTML</button></td>
        </tr>
        <tr>
            <td></td>
            <td><button id="checkForZeroSizeImagesButton">Check for Zero Size Images</button></td>
        </tr>
        <tr>
            <td></td>
            <td><button id="removeZeroSizeImagesButton">Remove Zero Size images</button></td>
        </tr>
        <tr>
            <td></td>
            <td><button id="removeAllImagesButton">Remove All Images (except cover)</button></td>
        </tr>
        <tr hidden="true">
            <td></td>
            <td><button id="listImagesButton">List Images in view order</button></td>
        </tr>
        <tr hidden="true">
            <td>Watermark</td>
            <td><textarea id="watermark" type="text" name="watermark" rows="6" cols="70">&lt;a href="www.novelparadise.com"&gt;This EPUB was downloaded from www.novelparadise.com&lt;/a&gt;</textarea></td>
        </tr>
        <tr hidden="true">
            <td></td>
            <td><button id="watermarkButton">Apply Watermark</button></td>
        </tr>
        <tr>
            <td></td>
            <td><button id="extractImagesButton">Extract Images</button></td>
        </tr>
        <tr>
            <td></td>
            <td><button id="removeElementsButton">Delete elements matching CSS</button><input id="removeCssInput" type="text" value="div.m-thou.mb48"></td>
        </tr>
        <tr>
            <td></td>
            <td><button id="cleanChrysanthemumGardenButton">Clean ChrysanthemumGarden</button></td>
        </tr>
        <tr>
            <td></td>
            <td><button id="sanitizeButton">Sanitize XHTML</button></td>
        </tr>
        <tr>
            <td></td>
            <td><button id="convertTableToDivButton">Convert royalroad Table to Div (better tolino readability)</button></td>
        </tr>
        <tr>
            <td></td>
            <td><button id="appendSourceLinkInEachChapterButton">Append source link in each chapter</button></td>
        </tr>
        <tr>
            <td></td>
            <td><button id="linkExtraFontsButton">Link extra fonts (ChrysanthemumGarden, requiemtls etc.)</button></td>
        </tr>
        <tr>
            <td></td>
            <td><button id="updateDateButton">Update Date</button><input id="updateDateInput" type="text" value="2026-03-10"></td>
        </tr>
        <tr>
            <td></td>
            <td><select id="updateTocHeadingLevel" aria-label="TOC heading level">
                <option value="auto">Automatic (H1 → H6)</option>
                <option value="h1">H1 only</option>
                <option value="h2">H2 only</option>
                <option value="h3">H3 only</option>
                <option value="h4">H4 only</option>
                <option value="h5">H5 only</option>
                <option value="h6">H6 only</option>
            </select>
            <button id="updateTocTitlesFromHeadingButton">Update TOC Titles from Chapter Heading</button></td>
        </tr>
    </table>
    <div id="outputTarget">
        <h4 id="listHeader"></h4>
        <ol id="fileList">

        </ol>
    </div>
    <script src="jszip.min.js"></script>
    <script src="wawoff2_decompress_binding.js"></script>
    <script src="https://opentype.js.org/dist/opentype.js"></script>
    <script src="Epub.js"></script>
    <script src="MergeEpub.js"></script>
    <script src="Sanitize.js"></script>
    <script src="main.js"></script>
</body>
</html>
